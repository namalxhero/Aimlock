name: Build Android Native Library (.so)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub Web UI එකෙන් manual run කිරීමට

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Find and Upload .so Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: native-libraries-so
        path: |
          app/build/intermediates/cmake/release/obj/**/*.so
          app/build/outputs/apk/release/*.apk
